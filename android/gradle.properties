org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier (legacy com.android.support → AndroidX rewriting) is unneeded here:
# every plugin already targets AndroidX. Leaving it on also broke release
# builds — it tried to rewrite byte-buddy's multi-release jar and choked on its
# Java 24 (class major 68) entries. Off = that transform is skipped entirely.
android.enableJetifier=false
